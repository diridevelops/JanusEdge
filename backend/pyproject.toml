[project]
name = "janusedge-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.1",
    "Flask-CORS==5.0.1",
    "Flask-JWT-Extended==4.7.1",
    "bcrypt==4.2.1",
    "flask-pymongo==2.3.0",
    "marshmallow==3.23.2",
    "minio==7.2.15",
    "pandas==2.2.3",
    "pyarrow>=25.0",
    "python-dotenv==1.1.0",
    "gunicorn==23.0.0",
    "dukascopy-market-data",
]

[dependency-groups]
dev = [
    "mongomock==4.2.0.post1",
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "pytest-flask==1.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
dukascopy-market-data = { git = "https://github.com/diridevelops/dukascopy-market-data-cli.git", rev = "60b20f3c16fa457edc3b0e9db4bc57919cd015df" }
